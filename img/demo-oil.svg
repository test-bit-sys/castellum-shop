<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Rose body oil">
  <defs>
    <radialGradient id="bg" cx="46%" cy="36%" r="74%">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="58%" stop-color="#f7efe4"/>
      <stop offset="100%" stop-color="#eadccb"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f7e9e6"/>
      <stop offset="100%" stop-color="#e3c9c6"/>
    </linearGradient>
    <linearGradient id="oil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7b3b0"/>
      <stop offset="100%" stop-color="#c98684"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24322c"/>
      <stop offset="100%" stop-color="#0d1512"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#54452a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="330" r="300" fill="#fff" opacity="0.6" filter="url(#soft)"/>
  <ellipse cx="400" cy="680" rx="260" ry="34" fill="#8d7a55" opacity="0.16" filter="url(#soft)"/>

  <!-- petals -->
  <g opacity="0.9">
    <path d="M176 300c-24-38-2-80 42-86 18 38 2 76-42 86z" fill="#d8a3a0"/>
    <path d="M600 250c30-28 72-16 84 26-34 24-72 14-84-26z" fill="#cf9491"/>
    <path d="M120 560c-30-22-32-64 4-84 26 28 26 66-4 84z" fill="#d8a3a0" opacity="0.8"/>
    <path d="M650 560c34-18 70 2 72 42-36 14-68-4-72-42z" fill="#c98684" opacity="0.85"/>
  </g>

  <!-- bottle -->
  <g filter="url(#shadow)">
    <rect x="316" y="236" width="168" height="360" rx="26" fill="url(#glass)" stroke="#e6d8d2" stroke-width="2"/>
    <path d="M316 470h168v100a26 26 0 0 1-26 26H342a26 26 0 0 1-26-26z" fill="url(#oil)"/>
    <rect x="356" y="168" width="88" height="84" rx="12" fill="url(#cap)"/>
    <rect x="372" y="140" width="56" height="40" rx="10" fill="#1b2722"/>
    <rect x="388" y="108" width="24" height="42" rx="12" fill="#2a3a33"/>
    <rect x="340" y="330" width="120" height="150" rx="8" fill="#fffaf3" opacity="0.94"/>
    <text x="400" y="364" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="2" fill="#3b4a42">CASTELLUM</text>
    <line x1="360" y1="380" x2="440" y2="380" stroke="#c9a44c" stroke-width="1.3"/>
    <text x="400" y="414" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="1" fill="#152a23">ROSE</text>
    <text x="400" y="444" text-anchor="middle" font-family="Georgia, serif" font-size="21" letter-spacing="1" fill="#b06d6c">BODY OIL</text>
    <text x="400" y="466" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2" fill="#8a7a58">100 ML · NOURISHING</text>
  </g>

  <path d="M636 330l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#c9a44c" opacity="0.8"/>
  <path d="M170 430l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#c9a44c" opacity="0.6"/>
</svg>
