<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Gift set">
  <defs>
    <radialGradient id="bg" cx="48%" cy="36%" r="72%">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="60%" stop-color="#f5eddf"/>
      <stop offset="100%" stop-color="#e7dac7"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3d31"/>
      <stop offset="100%" stop-color="#0c211a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd79a"/>
      <stop offset="50%" stop-color="#c9a44c"/>
      <stop offset="100%" stop-color="#9c7628"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98544"/>
      <stop offset="100%" stop-color="#6d421d"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#4d3d24" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="340" r="300" fill="#fff" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="400" cy="682" rx="290" ry="38" fill="#8d7a55" opacity="0.18" filter="url(#soft)"/>

  <!-- box -->
  <g filter="url(#shadow)">
    <rect x="330" y="372" width="330" height="250" rx="12" fill="url(#box)"/>
    <rect x="330" y="372" width="330" height="40" rx="10" fill="#264a3c"/>
    <rect x="470" y="372" width="48" height="250" fill="url(#ribbon)"/>
    <rect x="330" y="452" width="330" height="26" fill="url(#ribbon)" opacity="0.9"/>
    <path d="M470 372c-34-40-78-48-92-20-10 22 18 34 44 34z" fill="url(#ribbon)"/>
    <path d="M518 372c34-40 78-48 92-20 10 22-18 34-44 34z" fill="url(#ribbon)"/>
    <text x="495" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="3" fill="#e9d6a9">CASTELLUM</text>
    <text x="495" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#bda874">GIFT SET</text>
  </g>

  <!-- perfume mini -->
  <g filter="url(#shadow)">
    <rect x="174" y="392" width="120" height="190" rx="18" fill="url(#glass)"/>
    <rect x="208" y="356" width="52" height="44" rx="8" fill="#6d421d"/>
    <rect x="196" y="334" width="76" height="34" rx="9" fill="url(#ribbon)"/>
    <rect x="196" y="442" width="76" height="100" rx="6" fill="#fbf6e8"/>
    <text x="234" y="472" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="1" fill="#152a23">NOIR</text>
    <text x="234" y="492" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="1" fill="#b58c35">OUD</text>
    <text x="234" y="514" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" letter-spacing="1.5" fill="#7c6a45">50 ML</text>
  </g>

  <!-- oil mini -->
  <g filter="url(#shadow)">
    <rect x="636" y="440" width="92" height="160" rx="16" fill="#fbf2ef" stroke="#e4d3cd" stroke-width="2"/>
    <path d="M636 536h92v48a16 16 0 0 1-16 16h-60a16 16 0 0 1-16-16z" fill="#d79b98"/>
    <rect x="658" y="408" width="48" height="44" rx="8" fill="#1b2722"/>
    <rect x="624" y="496" width="116" height="34" rx="5" fill="#fffaf3"/>
    <text x="682" y="518" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1.4" fill="#8a5a58">ROSE OIL</text>
  </g>

  <path d="M132 300l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#c9a44c" opacity="0.85"/>
  <path d="M700 300l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#c9a44c" opacity="0.6"/>
</svg>
