<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Noir Oud perfume">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b2f"/>
      <stop offset="55%" stop-color="#0b211a"/>
      <stop offset="100%" stop-color="#07110d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9a44c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a44c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b97a3c"/>
      <stop offset="45%" stop-color="#8a5626"/>
      <stop offset="100%" stop-color="#5a3516"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd79a"/>
      <stop offset="50%" stop-color="#c9a44c"/>
      <stop offset="100%" stop-color="#8d6b25"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6e8"/>
      <stop offset="100%" stop-color="#e9ddc2"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="590" cy="210" r="320" fill="url(#glow)"/>
  <circle cx="190" cy="640" r="240" fill="url(#glow)" opacity="0.5"/>
  <ellipse cx="400" cy="674" rx="270" ry="38" fill="#000" opacity="0.4" filter="url(#soft)"/>

  <!-- bottle -->
  <g filter="url(#shadow)">
    <rect x="300" y="250" width="204" height="330" rx="30" fill="url(#glass)"/>
    <rect x="316" y="266" width="46" height="296" rx="23" fill="#e3b47a" opacity="0.25"/>
    <rect x="372" y="196" width="60" height="64" rx="10" fill="#6d421d"/>
    <rect x="352" y="164" width="100" height="52" rx="12" fill="url(#cap)"/>
    <rect x="352" y="164" width="100" height="14" rx="7" fill="#f3e3b8"/>
    <rect x="330" y="344" width="144" height="164" rx="8" fill="url(#label)"/>
    <text x="402" y="382" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="1.4" fill="#20362d">CASTELLUM</text>
    <line x1="358" y1="398" x2="446" y2="398" stroke="#b58c35" stroke-width="1.4"/>
    <text x="402" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="32" letter-spacing="1" fill="#152a23">NOIR</text>
    <text x="402" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="32" letter-spacing="1" fill="#b58c35">OUD</text>
    <text x="402" y="494" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1.8" fill="#7c6a45">EAU DE PARFUM · 100 ML</text>
  </g>

  <!-- oud wood -->
  <g fill="#5a3a1c" opacity="0.95">
    <path d="M214 640l58-22 42 14-52 26z"/>
    <path d="M236 662l48-16 30 12-44 22z" opacity="0.8"/>
    <path d="M548 636l54-18 36 16-50 20z"/>
  </g>
  <path d="M622 300l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#c9a44c" opacity="0.85"/>
  <path d="M180 340l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#c9a44c" opacity="0.6"/>
</svg>
